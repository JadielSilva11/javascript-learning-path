<!DOCTYPE html>
<html lang="PT-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador JavaScript</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <header>
        <h1>Vamos contar</h1>
    </header>
    <section>
        <div id="entrada">
            <p>Inicio: <input id="inicio" type="number"></p>
            
            <p>
                Fim: <input id="fim" type="number">
            </p>
            <p>
                Passo: <input id="passos" type="number">
            </p>
            <button onclick="contador()">Contar</button>
        </div>
        <div>
            <p id="resultado"> Preparando contagem...</p>
        </div>
    </section>
    <footer>
        <p>&copy; CursoemVídeo</p>
    </footer>
</body>
</html>
