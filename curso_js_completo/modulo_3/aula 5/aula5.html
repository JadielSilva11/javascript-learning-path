<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 5: eventos JavaScript</title>
</head>
<body>
    <h1 id="titulo">
        Atendimento
    </h1>

    <button id="btn">
        Alterar
    </button>

    <button id="voltar">
        Voltar
    </button>

    <script>
        const titulo = document.getElementById('titulo');
        const btn = document.getElementById('btn');
        const voltarBtn = document.getElementById('voltar');

        btn.addEventListener('click', () => {
            titulo.innerText = 'Sistema de atendimento';
        })

        voltarBtn.addEventListener('click', () => {
            titulo.innerText = 'Atendimento';
        })

    </script>
</body>
</html>
